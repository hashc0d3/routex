# Loki одним процессом, хранение на диске. Запуск: loki -config.file=loki.yaml -config.expand-env=true
# LOKI_DATA — каталог данных (в Docker /loki), LOKI_BIND — адрес (локально 127.0.0.1).
auth_enabled: false

server:
  http_listen_address: ${LOKI_BIND:-0.0.0.0}
  http_listen_port: 3100
  grpc_listen_address: ${LOKI_BIND:-0.0.0.0}
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA:-/loki}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA:-/loki}/chunks
      rules_directory: ${LOKI_DATA:-/loki}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # события храним 30 дней; журнал в БД — дольше
  retention_period: 720h
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: ${LOKI_DATA:-/loki}/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
